name: Build Angular Project with Sonar AI Fix

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ------------------------
    # CHECKOUT
    # ------------------------
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # ------------------------
    # NODE SETUP
    # ------------------------
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # ------------------------
    # INSTALL & BUILD
    # ------------------------
    - name: Install Dependencies
      run: npm install

    - name: Build Angular Project
      run: npm run build --if-present

    # ------------------------
    # SONARCLOUD SCAN (FIXED)
    # ------------------------
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=gireesh511
          -Dsonar.projectKey=Gireesh511_my-angular-app
          -Dsonar.sources=.
          -Dsonar.host.url=https://sonarcloud.io

    # ------------------------
    # WAIT FOR INDEXING
    # ------------------------
    - name: Wait for SonarCloud indexing
      run: |
        echo "⏳ Waiting for SonarCloud indexing..."
        sleep 30

    # ------------------------
    # DOWNLOAD SONAR ISSUES
    # ------------------------
    - name: Download Sonar Issues JSON
      run: |
        echo "📥 Downloading Sonar issues..."
        mkdir -p ai-agent

        API_URL="https://sonarcloud.io/api/issues/search"
        QUERY="organization=gireesh511&projectKeys=Gireesh511_my-angular-app&resolved=false&ps=500"

        HTTP_CODE=$(curl -s \
          -u "${{ secrets.SONAR_TOKEN }}:" \
          -w "%{http_code}" \
          "$API_URL?$QUERY" \
          -o ai-agent/sonar-issues.json)

        echo "HTTP STATUS: $HTTP_CODE"
        echo "----- sonar-issues.json -----"
        cat ai-agent/sonar-issues.json

        if [ "$HTTP_CODE" -ne 200 ]; then
          echo "❌ SonarCloud API failed"
          exit 1
        fi

    # ------------------------
    # CONFIGURE GIT
    # ------------------------
    - name: Configure Git User
      run: |
        git config --global user.name "sonar-ai-bot"
        git config --global user.email "sonar-ai-bot@users.noreply.github.com"

    # ------------------------
    # INSTALL AI AGENT
    # ------------------------
    - name: Install AI Agent Dependencies
      run: |
        cd ai-agent
        npm install

    # ------------------------
    # RUN AI FIX AGENT
    # ------------------------
    - name: Run AI Auto-Fix Agent
      run: |
        cd ai-agent
        node index.js
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_BRANCH: main

    # ------------------------
    # CHECK CHANGES
    # ------------------------
    - name: Detect changes
      id: changes
      run: |
        if git diff --quiet; then
          echo "changed=no" >> $GITHUB_OUTPUT
        else
          echo "changed=yes" >> $GITHUB_OUTPUT
        fi

    # ------------------------
    # COMMIT & PUSH
    # ------------------------
    - name: Commit and Push Code Fixes
      if: steps.changes.outputs.changed == 'yes'
      run: |
        git add .
        git commit -m "AI Auto-Fix: SonarCloud Issues"
        git push origin main
